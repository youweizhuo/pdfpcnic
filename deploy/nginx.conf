# nginx in the pdfpcnic container, as an unprivileged user. Port 8080 is public: the
# site's static files, and decks to read by their token. Port 8081 is private: it
# uploads decks, with no password, and can't change or delete any. Text files come
# gzipped from the build (gzip_static).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    # The pdf.js worker is a module; browsers refuse one served as anything but JavaScript.
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;
    charset utf-8;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip_static on;
    gzip_vary on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    types {
        application/json pdfpc;
    }

    # Files under assets/ have hashed names and never change; the rest are checked on each load. Decks stay out of every
    # cache, Cloudflare's included, so one deleted on the server is gone at once.
    map $uri $cache_control {
        ~^/assets/ "public, max-age=31536000, immutable";
        ~^/decks/ "no-store";
        default "no-cache";
    }

    # Decks are read from another origin too: the Mac app.
    map $uri $deck_origin {
        ~^/decks/ "*";
        default "";
    }

    # Who to slow down when guessing tokens: behind Cloudflare, which sets this itself, the visitor and not the tunnel.
    map $http_cf_connecting_ip $visitor {
        "" $binary_remote_addr;
        default $http_cf_connecting_ip;
    }
    limit_req_zone $visitor zone=tokens:1m rate=5r/s;
    limit_req_status 429;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Access-Control-Allow-Origin $deck_origin always;

        # A deck by its token, and its files by name. Reading only: nothing here can write, and nothing lists the decks.
        location ~ "^/decks/[a-z2-9]{6}/$" {
            root /data;
            autoindex on;
            autoindex_format json;
            limit_except GET { deny all; }
            limit_req zone=tokens burst=20 nodelay;
        }
        location ~* "^/decks/[a-z2-9]{6}/[^/]+\.(pdf|pdfpc)$" {
            root /data;
            disable_symlinks on;
            limit_except GET { deny all; }
        }
        location /decks/ {
            return 404;
        }
    }

    # The private side. A new file only: what's there is never overwritten, renamed or deleted from here.
    server {
        listen 8081;
        root /usr/share/nginx/upload;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

        location / {
            limit_except GET { deny all; }
        }
        # The site's public address, for the links the page shows; deploy/deploy.sh writes it.
        location = /public-url {
            root /data;
            default_type text/plain;
        }
        location ~ "^/decks/([a-z2-9]{6}/)?$" {
            root /data;
            autoindex on;
            autoindex_format json;
            limit_except GET { deny all; }
        }
        location ~* "^/decks/[a-z2-9]{6}/[^/]+\.(pdf|pdfpc)$" {
            root /data;
            disable_symlinks on;
            limit_except GET PUT { deny all; }
            set $guard $request_method;
            if (-f $request_filename) {
                set $guard "$guard:exists";
            }
            if ($guard = "PUT:exists") {
                return 409;
            }
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:r all:r;
            client_max_body_size 1g;
            client_body_temp_path /data/.uploading;
        }
        location /decks/ {
            return 404;
        }
    }
}
