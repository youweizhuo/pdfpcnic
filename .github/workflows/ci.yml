name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: End-to-end checks (Chrome)
        run: npm run e2e && npm run e2e -- site
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: End-to-end checks (Firefox)
        run: npm run e2e:firefox
        env:
          FIREFOX_PATH: /usr/bin/firefox
      - name: End-to-end checks (WebKit)
        run: npx playwright-core install --with-deps webkit && npm run e2e:webkit
      - name: Deck server (the real container, from its deploy script)
        run: deploy/deploy.sh http://127.0.0.1:28613 && npm run e2e:decks
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots
          path: e2e-out
          if-no-files-found: ignore
