# nginx in the pdfpcnic container: the site's static files, as an unprivileged
# user on port 8080. Text files come gzipped from the build (gzip_static).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    # The pdf.js worker is a module; browsers refuse one served as anything but JavaScript.
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;
    charset utf-8;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip_static on;
    gzip_vary on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Files under assets/ have hashed names and never change; the rest are checked on each load.
    map $uri $cache_control {
        ~^/assets/ "public, max-age=31536000, immutable";
        default "no-cache";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
