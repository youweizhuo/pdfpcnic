# The Mac app: built on macOS, then its smoke test drives it through the demo
# deck: the deck opens, both windows draw it, the audience goes fullscreen,
# the zip installs as an update, a reload resumes. Screenshots and the app are
# kept with the run.
name: Mac app

on:
  push:
    branches: ["**"]
    paths: ["mac/**", "src/**", "demo/**", "index.html", "vite.config.ts", "package*.json", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", "src/**", "demo/**", "index.html", "vite.config.ts", "package*.json", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sh mac/build.sh
      - name: Smoke test
        timeout-minutes: 5
        run: dist-mac/pdfpcnic.app/Contents/MacOS/pdfpcnic --smoke-test demo/demo.pdf demo/demo.pdfpc e2e-out/mac dist-mac/pdfpcnic-mac.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdfpcnic-mac
          path: |
            dist-mac/pdfpcnic-mac.zip
            e2e-out/mac
          if-no-files-found: ignore
